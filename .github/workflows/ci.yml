name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: windows-latest
            compiler: msvc
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTHORN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: sanitizers (gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTHORN_ENABLE_SANITIZERS=ON
          -DTHORN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build --output-on-failure

  install:
    name: install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and install
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTHORN_BUILD_TESTS=OFF -DTHORN_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/prefix"

      - name: Consume with find_package
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(consumer LANGUAGES C)
          find_package(ThornLib 0.1 REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE Thorn::thorn)
          EOF
          cat > consumer/main.c <<'EOF'
          #include <stdio.h>
          #include "thorn/core/version.h"
          int main(void) { puts(thorn_version_string()); return 0; }
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer/build --parallel
          ./consumer/build/consumer
